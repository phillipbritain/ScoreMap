# Tests, publishes and deploys ScoreMap to Azure App Service. Inert until set up: it only runs
# when started by hand (Actions > deploy > Run workflow), and skips itself unless the repository
# variable AZURE_WEBAPP_NAME and the secrets AZURE_CLIENT_ID, AZURE_TENANT_ID and
# AZURE_SUBSCRIPTION_ID exist. See docs/deploy.md ("Deploy from GitHub Actions").
name: deploy

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: dotnet test server/ScoreMap.slnx -c Release

      # Builds the browser app into the published wwwroot too.
      - run: dotnet publish server/src/ScoreMap.Server -c Release -o ${{ runner.temp }}/app

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ runner.temp }}/app
