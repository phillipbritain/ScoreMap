# Builds ScoreMap's image, pushes it to GitHub Container Registry tagged with the commit, and deploys
# it to Azure Container Apps as a new revision, on every push to main or when started by hand
# (Actions > deploy > Run workflow). Fails unless the new revision starts and takes the traffic.
# Started by hand on another branch, it only builds and pushes that branch's image: Azure only trusts
# runs on main. The deploy skips itself unless the repository variables AZURE_RESOURCE_GROUP and
# AZURE_CONTAINERAPP_NAME and the secrets AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID
# exist. See docs/deploy.md ("Deploy from GitHub Actions").
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One deploy at a time; a newer push waits for the running deploy rather than racing it.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      # GitHub Container Registry wants the name in lower case.
      IMAGE: ghcr.io/${{ github.repository_owner }}/scoremap:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/login@v3
        if: github.ref == 'refs/heads/main' && vars.AZURE_CONTAINERAPP_NAME != ''
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The update returns once Azure has accepted the new revision, not once it runs, so wait for
      # it: it must report Running and Healthy, and be the revision taking the traffic. A revision
      # that doesn't start leaves the old one serving, and fails the run.
      - name: Deploy the image as a new revision
        if: github.ref == 'refs/heads/main' && vars.AZURE_CONTAINERAPP_NAME != ''
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME }}
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          az containerapp update -g "$RG" -n "$APP" --image "$IMAGE" --only-show-errors -o none
          revision=$(az containerapp show -g "$RG" -n "$APP" --query properties.latestRevisionName -o tsv)
          echo "New revision: $revision"
          for i in $(seq 60); do
            read -r running health <<<"$(az containerapp revision show -g "$RG" -n "$APP" --revision "$revision" \
              --query '[properties.runningState, properties.healthState]' -o tsv | tr '\n' ' ')"
            ready=$(az containerapp show -g "$RG" -n "$APP" --query properties.latestReadyRevisionName -o tsv)
            echo "$(date -u +%T) running=$running health=$health ready=$ready"
            case "$running" in Failed|Degraded)
              echo "::error::Revision $revision didn't start ($running); the old revision is still serving"
              az containerapp logs show -g "$RG" -n "$APP" --revision "$revision" --type system --tail 50 || true
              exit 1;;
            esac
            if [[ "$health" == Healthy && "$ready" == "$revision" && "$running" == Running* ]]; then
              fqdn=$(az containerapp show -g "$RG" -n "$APP" --query properties.configuration.ingress.fqdn -o tsv)
              curl --fail --silent --show-error --max-time 30 "https://$fqdn/api/leagues" -o /dev/null
              echo "Deployed $IMAGE as $revision: https://$fqdn"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Revision $revision wasn't running and healthy after 10 minutes; the old revision is still serving"
          az containerapp logs show -g "$RG" -n "$APP" --revision "$revision" --type system --tail 50 || true
          exit 1
