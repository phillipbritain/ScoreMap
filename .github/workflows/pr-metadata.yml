# Checks a pull request's title and description for an AI tool coauthor trailer, which a squash merge
# could carry into main (the commits themselves: ci.yml's web job). Its own workflow, and cheap, so
# a title/description edit reruns only this, not ci.yml's full run. It also runs on each push, so
# every new commit gets a result. The rule is the one in scripts/check-commit-attribution.mjs.
name: pr-metadata

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

# A newer edit or push replaces a check still running on the old one, without touching ci.yml's.
concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check the title and description
        run: node scripts/check-commit-attribution.mjs --pr
